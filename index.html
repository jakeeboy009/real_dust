<!-- HTML5 문서 형식 선언 -->
<!DOCTYPE html>
<!-- 문서 언어를 한국어로 설정 -->
<html lang="ko">
<head>
  <!-- 문자 인코딩을 UTF-8로 지정 -->
  <meta charset="UTF-8" />
  <!-- 모바일 화면에서 반응형으로 보이도록 뷰포트 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 브라우저 탭에 표시될 페이지 제목 -->
  <title>공기 신호등 - 실시간 대기오염 정보</title>
  <!-- Pretendard 웹폰트 스타일시트 연결 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <!-- 외부 CSS 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 전체 콘텐츠를 감싸는 메인 컨테이너 -->
  <main class="container">
    <!-- 상단 제목과 시도 선택 영역 -->
    <header class="top-header">
      <!-- 페이지 메인 제목 -->
      <h1 class="app-title">공기 신호등</h1>
      <!-- 시도를 고르는 드롭다운 묶음 -->
      <div class="select-wrapper">
        <!-- 드롭다운 안내 라벨 -->
        <label for="sido-select" class="select-label">지역 선택</label>
        <!-- 18개 시도를 선택할 수 있는 드롭다운 -->
        <select id="sido-select" class="sido-select">
          <option value="전국">전국</option>
          <option value="서울" selected>서울</option>
          <option value="부산">부산</option>
          <option value="대구">대구</option>
          <option value="인천">인천</option>
          <option value="광주">광주</option>
          <option value="대전">대전</option>
          <option value="울산">울산</option>
          <option value="세종">세종</option>
          <option value="경기">경기</option>
          <option value="강원">강원</option>
          <option value="충북">충북</option>
          <option value="충남">충남</option>
          <option value="전북">전북</option>
          <option value="전남">전남</option>
          <option value="경북">경북</option>
          <option value="경남">경남</option>
          <option value="제주">제주</option>
        </select>
      </div>
    </header>

    <!-- 선택한 지역의 대표 공기 신호등 상태와 평균 수치를 크게 보여주는 요약 영역 -->
    <section id="summary-section" class="summary-section grade-unknown" aria-live="polite">
      <!-- 선택된 지역명 안내 제목 -->
      <p class="summary-label"><span id="selected-sido">서울</span> 대표 공기 상태</p>
      <!-- 이모지, 등급 글자, 평균 수치를 한눈에 크게 보여주는 신호등 박스 -->
      <div class="traffic-light-hero">
        <!-- 대표 등급 이모지 표시 영역 -->
        <span id="summary-emoji" class="summary-emoji" aria-hidden="true">⚪</span>
        <!-- 대표 등급 이름(좋음/보통/나쁨/매우나쁨) 표시 영역 -->
        <strong id="summary-grade-text" class="summary-grade-text">불러오는 중</strong>
        <!-- 지역 평균 미세먼지 수치와 단위 묶음 -->
        <div class="average-value-box">
          <!-- 평균 미세먼지 숫자 -->
          <strong id="average-pm10" class="average-number">-</strong>
          <!-- 미세먼지 농도 단위 표시 -->
          <span id="average-unit" class="average-unit">㎍/㎥</span>
        </div>
      </div>
      <!-- 등급에 따른 한 줄 행동 요령 안내 문구 -->
      <p id="summary-advice" class="summary-advice">잠시만 기다려 주세요</p>
      <!-- 등급 색상 기준 안내 범례 -->
      <ul class="grade-legend">
        <li class="legend-item grade-1">🔵 좋음</li>
        <li class="legend-item grade-2">🟢 보통</li>
        <li class="legend-item grade-3">🟠 나쁨</li>
        <li class="legend-item grade-4">🔴 매우나쁨</li>
        <li class="legend-item grade-unknown">⚪ 정보 없음</li>
      </ul>
    </section>

    <!-- 로딩 상태("불러오는 중...")나 오류 메시지를 보여주는 영역 -->
    <div id="status-message" class="status-message" role="status"></div>

    <!-- 측정소별 미세먼지 상위 10개 가로 막대그래프 영역 -->
    <section id="chart-section" class="chart-section" hidden>
      <!-- 그래프 제목 -->
      <h2 class="chart-title">미세먼지 높은 측정소 (상위 10곳)</h2>
      <!-- 그래프가 들어갈 반응형 컨테이너 -->
      <div id="chart-container" class="chart-container">
        <!-- Chart.js 가로 막대그래프를 그릴 캔버스 요소 -->
        <canvas id="pm10-chart" aria-label="측정소별 미세먼지 상위 10개 가로 막대그래프"></canvas>
      </div>
      <!-- 유효한 측정값이 없을 때 보여줄 안내 문구 -->
      <p id="chart-empty" class="chart-empty" hidden>그래프로 표시할 측정값이 없습니다.</p>
    </section>

    <!-- 측정소 카드들이 동적으로 추가될 그리드 영역 -->
    <section id="station-list" class="station-grid" aria-label="측정소 목록"></section>
  </main>

  <!-- Chart.js CDN 라이브러리 연결 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <!-- 외부 자바스크립트 파일 연결 -->
  <script src="script.js"></script>
</body>
</html>
